<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - IoT Monitoring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- HEADER -->
        <header>
            <div class="header-info">
                <h1>IoT Dashboard</h1>
                <p class="subtitle">Sistem Monitoring Real-time</p>
                <p class="user-info" id="user-display">Memuat pengguna...</p>
            </div>
            
            <div class="header-actions">
                <!-- LINK KE HALAMAN DOWNLOAD TERPISAH -->
                <a href="download.html" class="icon-btn" title="Unduh Kode Arduino">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </a>

                <a href="settings.html" class="settings-btn">Pengaturan</a>
                <a href="dev/index.html" class="dev-btn" title="Mode Pengembangan">🧪 Dev Mode</a>
                <button id="logoutBtn" class="logout-btn">Keluar</button>
            </div>
        </header>

        <!-- MAIN DASHBOARD: WIDGET AKAN MUNCUL DI SINI SECARA DINAMIS -->
        <main class="dashboard" id="dynamic-dashboard">
            <p class="loading-text" style="text-align: center; color: var(--text-secondary); padding: 40px;">Memuat data dari server...</p>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="widget/base-widget.js"></script>
    <script src="templates.js"></script>
    <script src="template_4x.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
