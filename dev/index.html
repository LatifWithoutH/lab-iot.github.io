<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Mode - Pilih Eksperimen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', monospace;
    background: #0a0a0a;
    color: #00ff88;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .back-btn {
    align-self: flex-start;
    background: transparent; border: 1px solid #00ff88; color: #00ff88;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    font-family: 'Courier New', monospace; font-weight: bold;
    text-decoration: none; transition: all 0.2s;
  }
  .back-btn:hover { background: #00ff88; color: #000; box-shadow: 0 0 15px #00ff88; }

  header { text-align: center; margin: 30px 0 10px; }
  h1 { font-size: 2rem; text-shadow: 0 0 15px #00ff88; }
  .badge-dev {
    display: inline-block; background: #ff9500; color: #000;
    padding: 2px 10px; border-radius: 20px; font-size: 0.7rem;
    font-weight: bold; margin-left: 8px; vertical-align: middle;
  }
  .user-info {
    color: #888; font-size: 0.9rem; margin-bottom: 30px;
    border: 1px dashed #333; padding: 6px 14px; border-radius: 20px;
  }
  .user-info span { color: #00ff88; font-weight: bold; }

  .subtitle {
    color: #aaa; font-size: 0.95rem; margin-bottom: 25px; text-align: center;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 900px;
  }

  .card {
    background: #1a1a1a;
    border: 2px solid #00ff88;
    border-radius: 14px;
    padding: 25px 20px;
    text-decoration: none;
    color: #00ff88;
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
  }
  .card:hover {
    background: #00ff88;
    color: #000;
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
  }
  .card .icon { font-size: 3rem; margin-bottom: 12px; }
  .card .title { font-size: 1.2rem; font-weight: bold; margin-bottom: 6px; }
  .card .desc { font-size: 0.8rem; color: #aaa; }
  .card:hover .desc { color: #333; }

  .card.coming-soon {
    border-color: #444;
    color: #555;
    cursor: not-allowed;
    opacity: 0.6;
  }
  .card.coming-soon:hover {
    background: #1a1a1a;
    color: #555;
    transform: none;
    box-shadow: none;
  }
  .card.coming-soon .desc { color: #555; }
  .card.coming-soon:hover .desc { color: #555; }

  footer {
    margin-top: 40px;
    color: #555;
    font-size: 0.75rem;
    text-align: center;
  }
</style>
</head>
<body>

<!-- 🛡️ SATPAM: CEK LOGIN -->
<script>
  const dbUrl = localStorage.getItem('iot_db_url');
  const dbSecret = localStorage.getItem('iot_db_secret');
  const userId = localStorage.getItem('iot_user_id');

  if (!dbUrl || !dbSecret || !userId) {
    window.location.href = '../login.html';
  }
</script>

<a href="../dashboard.html" class="back-btn">← Kembali ke Dashboard</a>

<header>
  <h1>🧪 DEV MODE <span class="badge-dev">BETA</span></h1>
</header>
<div class="user-info">Pilot aktif: <span id="displayUser">...</span></div>
<p class="subtitle">Pilih eksperimen yang mau dicoba:</p>

<div class="menu-grid">

  <!-- ✅ FITUR AKTIF: ULAR -->
  <a href="ular.html" class="card">
    <div class="icon">🐍</div>
    <div class="title">Snake IoT</div>
    <div class="desc">Kontrol game ular via Firebase Realtime DB</div>
  </a>

  <!-- 🔜 FITUR COMING SOON (contoh, bisa ditambah nanti) -->
  <div class="card coming-soon">
    <div class="icon">💡</div>
    <div class="title">LED Matrix</div>
    <div class="desc">Coming soon...</div>
  </div>

  <div class="card coming-soon">
    <div class="icon">🌡️</div>
    <div class="title">Sensor Logger</div>
    <div class="desc">Coming soon...</div>
  </div>

  <div class="card coming-soon">
    <div class="icon">🚗</div>
    <div class="title">RC Car Control</div>
    <div class="desc">Coming soon...</div>
  </div>

</div>

<footer>
  Dev Mode — Tempat uji coba fitur eksperimental 🔬
</footer>

<script>
  document.getElementById('displayUser').textContent = userId;
</script>

</body>
</html>
